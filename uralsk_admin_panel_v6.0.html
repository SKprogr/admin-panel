<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>УРАЛЬСК ONLINE — Админ-панель v6.0</title>
<style>
/* ============================================================
   ТЕМА — СВЕТЛАЯ (по умолчанию) / ТЁМНАЯ (data-theme="dark")
   ============================================================ */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef1f6;
  --inset:#f1f4f9;
  --border:#dfe3ea; --border-strong:#cbd2dd;
  --text:#1b2330; --text-muted:#586274; --text-dim:#8a94a3;
  --accent:#284b8c; --accent-2:#2f5699; --accent-weak:rgba(40,75,140,.10);
  --danger:#d1435b; --danger-weak:rgba(209,67,91,.10);
  --warn:#c8860a; --warn-weak:rgba(200,134,10,.12);
  --success:#1f9d6b; --success-weak:rgba(31,157,107,.12);
  --purple:#7c4dff; --purple-weak:rgba(124,77,255,.12);
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow:0 1px 3px rgba(16,24,40,.10),0 1px 2px rgba(16,24,40,.06);
  --shadow-lg:0 10px 30px rgba(16,24,40,.12);
  --grid-line:rgba(20,30,55,.06);
  --scrim:rgba(20,28,45,.45);
}
html[data-theme="dark"]{
  --bg:#0a0d14; --surface:#11151f; --surface-2:#151a26; --surface-3:#1a2030;
  --inset:#0e1118;
  --border:#232a3d; --border-strong:#2f3851;
  --text:#e6ebf2; --text-muted:#8a94a8; --text-dim:#5a6378;
  --accent:#5b83c4; --accent-2:#8fb0e6; --accent-weak:rgba(91,131,196,.16);
  --danger:#e0607a; --danger-weak:rgba(224,96,122,.14);
  --warn:#d6a53a; --warn-weak:rgba(214,165,58,.14);
  --success:#4ea36a; --success-weak:rgba(78,163,106,.16);
  --purple:#9a7dff; --purple-weak:rgba(154,125,255,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 2px 8px rgba(0,0,0,.4);
  --shadow-lg:0 16px 40px rgba(0,0,0,.55);
  --grid-line:rgba(255,255,255,.04);
  --scrim:rgba(0,0,0,.72);
}

/* Цвета семей — постоянные в обеих темах */
:root{
  --f-first:#6366f1; --f-urlsk:#2563eb; --f-west:#10b981; --f-kings:#f59e0b; --f-free:#94a3b8;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter','Segoe UI',Tahoma,system-ui,sans-serif;
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  transition:background .25s ease,color .25s ease;
}
.mono{font-family:'JetBrains Mono','Consolas','Courier New',monospace}
h1,h2,h3,h4{margin:0}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

/* ===== КАРКАС ===== */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.topbar{
  grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:11px 20px;background:var(--surface);
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.hamburger{display:none;background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);width:38px;height:38px;border-radius:9px;cursor:pointer;align-items:center;justify-content:center}
.hamburger svg{width:20px;height:20px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
  font-size:14px;letter-spacing:.5px;flex-shrink:0;box-shadow:var(--shadow-sm)}
.brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-title{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-right{display:flex;align-items:center;gap:10px}
.tb-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface-2);
  padding:6px 11px;border-radius:9px;color:var(--text-muted);font-size:12px;font-family:'JetBrains Mono',monospace}
.tb-pill svg{width:14px;height:14px}
.icon-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-weak)}
.icon-btn svg{width:17px;height:17px}
.role-select{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);
  border-radius:9px;padding:4px 4px 4px 11px}
.role-select .lbl{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.role-select select{border:none;background:transparent;color:var(--text);font-family:inherit;font-size:12px;font-weight:600;
  padding:5px 6px;border-radius:6px;cursor:pointer;max-width:200px;outline:none}
.role-select select:focus{background:var(--surface-3)}

/* ===== БОКОВОЕ МЕНЮ ===== */
.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:2px;
  position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.admin-chip{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface-2);margin-bottom:12px}
.admin-chip .av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.admin-chip .who{min-width:0}
.admin-chip .who .n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-chip .who .r{font-size:10px;color:var(--success);font-weight:700;margin-top:2px;display:flex;align-items:center;gap:5px}
.admin-chip .who .r .dot{width:6px;height:6px;border-radius:50%;background:var(--success);flex-shrink:0}
.nav-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-dim);padding:10px 12px 4px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;background:transparent;border:1px solid transparent;
  border-radius:9px;color:var(--text-muted);text-align:left;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--accent-weak);color:var(--accent-2);border-color:transparent}
.nav-item.active svg{color:var(--accent-2)}
.nav-item .ico{width:18px;height:18px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;color:inherit}
.nav-item .ico svg{width:18px;height:18px}
.nav-item .badge{margin-left:auto;font-size:10px;font-family:'JetBrains Mono',monospace;background:var(--surface-3);
  color:var(--text-muted);border:1px solid var(--border);padding:1px 7px;border-radius:20px}
.nav-item.active .badge{background:var(--accent);color:#fff;border-color:transparent}
.nav-item.locked{opacity:.4;cursor:not-allowed}
.nav-item.locked:hover{background:transparent;color:var(--text-muted)}
.sb-foot{margin-top:auto;padding:12px;font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;line-height:1.6;border-top:1px solid var(--border)}
.nav-group{margin-bottom:2px}
.nav-group.ghost{opacity:.45}
.nav-grp-h{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;cursor:pointer;font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--text-dim);font-weight:800;padding:11px 12px 5px}
.nav-grp-h:hover{color:var(--text-muted)}
.nav-grp-h .chev{width:12px;height:12px;transition:transform .18s;flex-shrink:0}
.nav-grp-h .chev.open{transform:rotate(90deg)}
.nav-grp-body{display:flex;flex-direction:column;gap:2px}
.lockic{margin-left:auto;opacity:.5;display:inline-flex}
.lockic svg{width:13px;height:13px}
.dir-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.dir-tile{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);cursor:pointer;transition:all .13s}
.dir-tile:hover{border-color:var(--border-strong);transform:translateY(-1px);box-shadow:var(--shadow)}
.dir-tile.locked{cursor:not-allowed;opacity:.55}
.dir-tile .dt-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dir-tile .dt-ic svg{width:20px;height:20px}
.dir-tile .dt-b{flex:1;min-width:0}
.dir-tile .dt-n{font-size:13px;font-weight:800}
.dir-tile .dt-m{font-size:11px;color:var(--text-muted);margin-top:2px}
.dir-tile .dt-chev{width:16px;height:16px;color:var(--text-dim);flex-shrink:0}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:8px}
.pyr-row{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)}
.pyr-em{font-size:18px;flex-shrink:0}
.pyr-n{font-weight:800;font-size:13px}
.pyr-r{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
.dir-cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.tog-list{display:flex;flex-direction:column;gap:2px}
.tog-row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600}
.tog-row:last-child{border-bottom:none}
.switch{width:44px;height:24px;border-radius:20px;border:1px solid var(--border-strong);background:var(--surface-3);position:relative;cursor:pointer;transition:all .18s;padding:0;flex-shrink:0}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--text-dim);transition:all .18s}
.switch.on{background:var(--success);border-color:var(--success)}
.switch.on .knob{left:22px;background:#fff}

/* ===== КОНТЕНТ ===== */
.content{padding:22px 26px;min-width:0;max-width:1500px}
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes slidedown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.section-head{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.section-head h2{font-size:19px;font-weight:800;letter-spacing:.2px}
.section-head .desc{font-size:12.5px;color:var(--text-muted);margin-top:5px;max-width:760px}
.tab-flag{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);padding:6px 12px;border-radius:9px;font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text-muted)}
.tab-flag .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ===== КАРТОЧКИ / СЕТКИ ===== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm)}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow-sm);transition:border-color .15s}
.stat:hover{border-color:var(--border-strong)}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);font-weight:700;display:flex;align-items:center;gap:7px}
.stat .k svg{width:15px;height:15px}
.stat .v{font-size:26px;font-weight:800;margin-top:8px;font-family:'JetBrains Mono',monospace;letter-spacing:-.5px}
.stat .v small{font-size:12px;font-weight:600;color:var(--text-dim);font-family:'Inter',sans-serif}
.stat.a-accent{border-top:3px solid var(--accent)}
.stat.a-success{border-top:3px solid var(--success)}
.stat.a-danger{border-top:3px solid var(--danger)}
.stat.a-warn{border-top:3px solid var(--warn)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm)}
.panel-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.panel-title svg{width:17px;height:17px;color:var(--accent)}

/* ===== КНОПКИ / ФОРМЫ ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  font-size:12.5px;font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer;transition:all .13s}
.btn:hover{border-color:var(--border-strong)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-danger{background:var(--danger-weak);color:var(--danger);border-color:transparent}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:8px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);font-weight:700}
input,select,textarea{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;
  padding:9px 11px;border-radius:9px;outline:none;transition:border-color .13s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select{cursor:pointer}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--text-muted);font-size:11.5px;font-weight:700;padding:7px 12px;border-radius:7px;cursor:pointer;transition:all .12s}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm)}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.toolbar .grow{flex:1;min-width:200px}
.badge-lvl{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;background:var(--warn-weak);color:var(--warn);border:1px solid transparent;padding:2px 7px;border-radius:20px;white-space:nowrap}
.badge-grp{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:20px;letter-spacing:.5px}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface-3);color:var(--text-muted);border:1px solid var(--border)}

/* ===== КАРТА КАПТОВ ===== */
.map-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow-sm)}
.map-board{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--inset)}
.map-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat;z-index:0}
.map-board.has-img .map-grid-fallback{opacity:0}
.map-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.02));pointer-events:none}
html[data-theme="dark"] .map-scrim{background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,.12))}
.map-grid-fallback{position:absolute;inset:0;z-index:0;opacity:1;transition:opacity .3s;
  background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
  background-size:5% 5%}
.map-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:2px;padding:10px}
.map-cell{position:relative;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:8px;
  font-family:'JetBrains Mono',monospace;font-weight:700;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.14);border-radius:2px;
  transition:transform .1s,box-shadow .1s,border-color .1s;user-select:none;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.map-cell:hover{transform:scale(1.32);z-index:6;border-color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.map-cell.unique::after{content:'';position:absolute;top:1px;right:1px;width:5px;height:5px;background:#ffd54a;border-radius:50%;box-shadow:0 0 4px #ffd54a}
.map-cell.dim{opacity:.22;filter:grayscale(.4)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;padding:12px 4px 2px}
.legend .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:middle}
.fam-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.fam-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--f-free);border-radius:12px;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm)}
.fam-card .lbl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);font-weight:700}
.fam-card .cnt{font-size:17px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:3px}
.fam-card .inc{font-size:11.5px;color:var(--success);font-weight:700;margin-top:2px;font-family:'JetBrains Mono',monospace}
.fam-card .uq{font-size:10.5px;color:var(--warn);margin-top:2px;font-family:'JetBrains Mono',monospace}
.fam-card .tag{font-size:10px;font-weight:800;color:#fff;padding:4px 8px;border-radius:6px;background:var(--f-free);letter-spacing:.5px}

/* ===== ТАБЛИЦЫ ===== */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:auto;box-shadow:var(--shadow-sm)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--surface-2);color:var(--text-muted);font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;position:sticky;top:0}
tbody tr:hover td{background:var(--accent-weak)}
td.mono,th.mono{font-family:'JetBrains Mono',monospace}
tr:last-child td{border-bottom:none}

/* ===== КОМАНДЫ ===== */
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.cmd-group-title{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:14px 0 2px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted)}
.cmd-group-title .ln{flex:1;height:1px;background:var(--border)}
.cmd-group-title .n{background:var(--surface-3);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-family:'JetBrains Mono',monospace;color:var(--text-dim)}
.cmd-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow-sm);transition:border-color .13s}
.cmd-card:hover{border-color:var(--border-strong)}
.cmd-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmd-card .name{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--accent-2)}
.cmd-card .desc{font-size:11.5px;color:var(--text-muted);line-height:1.45}
.cmd-card .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:7px;gap:8px}
.cmd-card .syn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-card .copy{background:transparent;border:none;color:var(--accent-2);font-size:10px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;padding:3px 5px;border-radius:6px}
.cmd-card .copy:hover{background:var(--accent-weak)}

/* ===== АВТОПАРК ===== */
.veh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.veh-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow-sm)}
.veh-card .n{font-size:13px;font-weight:700}
.veh-card .m{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-2);margin-top:2px}
.veh-card .c{font-size:10px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* ===== РЕГЛАМЕНТ ===== */
.punish-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.punish-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--danger);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow-sm)}
.punish-card .t{font-size:12.5px;font-weight:800;color:var(--danger);text-transform:uppercase;letter-spacing:.5px}
.punish-card .b{font-size:12px;color:var(--text-muted);margin-top:7px;line-height:1.5}
.punish-card.warn{border-left-color:var(--warn)}
.punish-card.warn .t{color:var(--warn)}

/* ===== ЛИДЕРЫ / СОСТАВ ===== */
.leader-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.leader-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between}
.leader-card .bar{position:absolute;top:0;left:0;right:0;height:4px}
.leader-card.frozen{border-color:var(--danger)}
.leader-card h4{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.leader-card .fid{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text-dim);margin-top:3px}
.leader-card .fdesc{font-size:11.5px;color:var(--text-muted);margin:10px 0;line-height:1.5}
.box{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:11px}
.mini-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin:12px 0}
.mini-3 .m{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 4px}
.mini-3 .m .k{font-size:9px;text-transform:uppercase;color:var(--text-dim);font-weight:700}
.mini-3 .m .v{font-size:14px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-top:3px}
.warndots{display:flex;gap:4px}
.warndots span{width:18px;height:8px;border-radius:3px;background:var(--surface-3);border:1px solid var(--border)}
.warndots span.on{background:var(--danger);border-color:transparent}
.status-badge{font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:800;padding:3px 9px;border-radius:20px}
.status-badge.active{color:var(--success);background:var(--success-weak)}
.status-badge.frozen{color:var(--danger);background:var(--danger-weak)}
.rank-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--surface-3);border:1px solid var(--border)}
.online-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ===== КАПТЫ (famq) ===== */
.cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.cap-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
.cap-card .side{position:absolute;left:0;top:0;bottom:0;width:4px}
.cap-vs{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px;display:flex;align-items:center;justify-content:space-between;text-align:center;margin:8px 0 12px}
.cap-vs .team{width:42%}
.cap-vs .team .side-lbl{font-size:8px;font-weight:800;letter-spacing:.5px}
.cap-vs .team .nm{font-size:13px;font-weight:800;margin-top:3px}
.cap-vs .mid{width:16%;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--accent)}
.cap-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px;margin-bottom:10px}
.cap-meta .m{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px}
.cap-meta .m .k{color:var(--text-dim);font-size:9px;text-transform:uppercase;font-weight:700}
.cap-meta .m .v{font-weight:700;margin-top:2px}
.note{border-radius:9px;padding:9px 11px;font-size:11px;margin-bottom:10px}
.note.win{background:var(--success-weak);border:1px solid transparent}
.note.cancel{background:var(--danger-weak);border:1px solid transparent}
.note.annul{background:var(--purple-weak);border:1px solid transparent}

/* ===== ИЕРАРХИЯ / ДОСТУПЫ ===== */
.hier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:8px}
.rank-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow-sm);border-left:4px solid var(--accent)}
.rank-card .rn{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.rank-card .rl{font-size:11px;color:var(--text-muted);margin-top:5px}
.rank-card .rlv{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent-2);margin-top:6px;font-weight:700}
.dir-block{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.dir-block .dh{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pos-list{display:flex;flex-wrap:wrap;gap:8px}
.pos-item{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.matrix-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm)}
table.matrix th,table.matrix td{text-align:center}
table.matrix th:first-child,table.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--surface-2);z-index:2;font-weight:700}
table.matrix td:first-child{background:var(--surface)}
.tick{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:transparent;transition:all .12s}
.tick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tick svg{width:13px;height:13px}
.lvl-mini{width:64px;padding:5px 6px;font-size:11px;font-family:'JetBrains Mono',monospace}

/* ===== ЛОГИ ===== */
.logs-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;max-height:600px;overflow-y:auto;box-shadow:var(--shadow-sm)}
.log-line{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.log-line:last-child{border-bottom:none}
.log-line .tm{font-family:'JetBrains Mono',monospace;color:var(--text-dim);font-size:11px;white-space:nowrap}
.log-line .cat{font-size:9px;font-weight:800;text-transform:uppercase;padding:2px 7px;border-radius:20px;white-space:nowrap;font-family:'JetBrains Mono',monospace}
.log-line .msg{color:var(--text-muted);flex:1}
.cat-system{background:var(--accent-weak);color:var(--accent-2)}
.cat-admin{background:var(--warn-weak);color:var(--warn)}
.cat-capture{background:var(--danger-weak);color:var(--danger)}
.cat-family{background:var(--purple-weak);color:var(--purple)}
.cat-roster{background:var(--success-weak);color:var(--success)}
.cat-leader{background:var(--warn-weak);color:var(--warn)}

/* ===== МОДАЛКА ===== */
.overlay{display:none;position:fixed;inset:0;background:var(--scrim);z-index:100;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.overlay.open{display:flex}
.modal{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:24px;position:relative;box-shadow:var(--shadow-lg);animation:fade .25s ease}
.modal h3{font-size:17px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:9px}
.modal .m-sub{font-size:12px;color:var(--text-muted);margin-bottom:16px}
.modal-close{position:absolute;top:14px;right:16px;background:transparent;border:none;color:var(--text-muted);cursor:pointer;padding:4px;border-radius:6px}
.modal-close:hover{color:var(--text);background:var(--surface-2)}
.modal-close svg{width:18px;height:18px}
.info-block{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:14px;margin-bottom:14px}
.info-block .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.info-block .row .lbl{color:var(--text-muted)}
.info-block .row .val{font-weight:700;font-family:'JetBrains Mono',monospace}
.uniq-badge{display:inline-block;background:var(--warn-weak);color:var(--warn);border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:800;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.modal-actions .btn{flex:1;justify-content:center}

/* ===== ТОСТЫ ===== */
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:11px;padding:12px 15px;font-size:12.5px;box-shadow:var(--shadow-lg);display:flex;gap:11px;align-items:flex-start;animation:slidein .3s cubic-bezier(.16,1,.3,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.toast.success{border-left-color:var(--success)}
.toast.error,.toast.critical{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warn)}
.toast .tt{font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-weight:800}
.toast .tb{margin-top:2px;color:var(--text)}
.toast svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--accent)}

.empty{padding:44px;text-align:center;color:var(--text-dim);font-size:13px;background:var(--surface);border:1px dashed var(--border);border-radius:14px}
.empty svg{width:30px;height:30px;margin-bottom:10px;opacity:.6}
.hidden{display:none!important}
.sb-backdrop{display:none}
.spacer{height:16px}

/* ===== АДАПТИВ ===== */
@media(max-width:1080px){
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:1fr}
  .fam-stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .hamburger{display:inline-flex}
  .sidebar{position:fixed;top:56px;left:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .25s ease;height:calc(100vh - 56px);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .sb-backdrop{display:none;position:fixed;inset:56px 0 0 0;background:var(--scrim);z-index:55}
  .sb-backdrop.open{display:block}
  .content{padding:16px}
  .grid-2{grid-template-columns:1fr}
  .role-select .lbl{display:none}
  .brand-sub{display:none}
  .map-grid{gap:1px;padding:5px}
  .map-cell{font-size:0}
  .map-cell.unique::after{width:4px;height:4px}
}
@media(max-width:560px){
  .grid-4,.fam-stats{grid-template-columns:1fr}
  .cmd-grid,.veh-grid,.leader-grid,.cap-grid{grid-template-columns:1fr}
  .tb-pill.clock{display:none}
  .section-head h2{font-size:16px}
}
</style>

function esc(s){if(s==null)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function rub(n){return Number(n).toLocaleString('ru-RU');}
function hexA(hex,a){let h=hex.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return 'rgba('+r+','+g+','+b+','+a+')';}
function famById(id){return families.find(f=>f.id===id);}
function famColor(id){if(id==='FREE'||!id)return getCssVar('--f-free');const f=famById(id);return f?f.color:getCssVar('--f-free');}
function famName(id){if(id==='FREE'||!id)return 'Свободная';const f=famById(id);return f?f.name:id;}
function getCssVar(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#94a3b8';}
function rankName(r){return RANK_NAMES[Number(r)]||'Рекрут';}
function terrCount(fid){return territories.filter(t=>t.controller===fid).length;}
function terrProfit(fid){return territories.filter(t=>t.controller===fid).reduce((s,t)=>s+t.profit,0);}
function terrUniq(fid){return territories.filter(t=>t.controller===fid&&t.isUnique).length;}

function genTerritories(){
 territories=[];
 const pool=families.map(f=>f.id);
 for(let i=1;i<=400;i++){
   const u=UNIQUE_MAP[i];
   let controller;
   if(i%6===0)controller='FREE';
   else controller=pool[(i*7)%pool.length];
   territories.push({id:i,controller,isUnique:!!u,name:u?u.name:null,profit:u?u.profit:5000,components:u&&u.components?u.components:null,bonus:u&&u.bonus?u.bonus:null});
 }
 captures.filter(c=>c.status==='completed'&&c.winnerId).forEach(c=>{
   const t=territories.find(x=>x.id===c.territoryId);
   if(t){if(!c.prevController)c.prevController=(c.winnerId===c.attackerId?c.defenderId:c.attackerId);t.controller=c.winnerId;}
 });
 const ov=load('terr');
 if(ov)territories.forEach(t=>{if(ov[t.id])t.controller=ov[t.id];});
}

 if(id==='families')n=families.length;
 else if(id==='roster')n=members.length;
 else if(id==='captures')n=captures.filter(c=>c.status==='upcoming').length;
 else if(id==='map')n=400;
 else if(id==='staff')n=admins.length;
 else if(id==='applications')n=applications.filter(a=>a.status==='new'||a.status==='interview').length;
 else if(id==='gov')n=gov.length;
 else if(id==='cheat')n=chcases.filter(c=>c.status!=='cleared').length;
 else if(id==='forum')n=forum.filter(f=>f.status!=='closed').length;
 else if(id==='tech')n=tech.filter(t=>t.status!=='done').length;
 else if(id==='events')n=events.filter(e=>e.status!=='done').length;

 return (n===null||n===undefined)?'':'<span class="badge">'+n+'</span>';

function renderNav(){
 const nav=document.getElementById('nav');
 const groups=[],seen={};
 SECTIONS.forEach(s=>{if(!seen[s.group]){seen[s.group]=1;groups.push(s.group);}});
 let html='';
 groups.forEach(g=>{
   const items=SECTIONS.filter(s=>s.group===g);
   const anyAllowed=items.some(s=>canAccess(s.id));
   const collapsed=!!navCollapsed[g];
   html+='<div class="nav-group'+(anyAllowed?'':' ghost')+'">'
     +'<button class="nav-grp-h" data-grp="'+g+'" onclick="toggleNavGroup(this.dataset.grp)"><span>'+g+'</span>'+ic('chev','chev'+(collapsed?'':' open'))+'</button>'
     +'<div class="nav-grp-body'+(collapsed?' hidden':'')+'">';
   items.forEach(s=>{
     const allowed=canAccess(s.id);
     html+='<button class="nav-item'+(s.id===activeTab?' active':'')+(allowed?'':' locked')+'" data-tab="'+s.id+'" onclick="navClick(\''+s.id+'\','+allowed+')"><span class="ico">'+ic(s.icon)+'</span><span>'+esc(s.name)+'</span>'+(allowed?navBadge(s.id):'<span class="lockic">'+ic('lock')+'</span>')+'</button>';
   });
   html+='</div></div>';
 });
 nav.innerHTML=html;
}

function toast(text,type){
 type=type||'info';
 const icons={success:'ok',error:'alert',critical:'flame',warning:'alert',info:'bell'};
 const box=document.getElementById('toasts');
 const el=document.createElement('div');
 el.className='toast '+type;

function copyText(t){

function fbCopy(t){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Скопировано: '+t,'success');}catch(e){toast('Ошибка копирования','error');}document.body.removeChild(ta);}

function dirPrimary(key){return {lead:'hierarchy',hr:'staff',gov:'gov',crime:'families',media:'media',event:'events',log:'loggers',ch:'cheat',forum:'forum',tech:'tech'}[key]||'dashboard';}
function dirMetric(key){
 switch(key){
  case 'lead':return RANKS.length+' рангов · '+admins.filter(a=>a.dir==='lead').length+' чел.';
  case 'hr':return admins.length+' в штате · '+applications.filter(a=>a.status==='new').length+' заявок';
  case 'gov':return gov.length+' организаций · '+blackstate.length+' в ЧС';
  case 'crime':return families.length+' семей · '+captures.filter(c=>c.status==='upcoming').length+' каптов';
  case 'media':return media.filter(m=>m.status==='active').length+' мейкеров · '+promos.filter(p=>p.active).length+' промо';
  case 'event':return events.filter(e=>e.status!=='done').length+' активных';
  case 'log':return logusers.length+' доступов к логам';
  case 'ch':return chcases.filter(c=>c.status!=='cleared').length+' активных дел';
  case 'forum':return forum.filter(f=>f.status!=='closed').length+' открытых обращений';
  case 'tech':return tech.filter(t=>t.status!=='done').length+' тикетов';
 }
 return '';
}

 const d2=new Date();
 captures.push({id:'CAP-'+Math.floor(100+Math.random()*900),attackerId:a,defenderId:d,territoryId:zone,weaponType:weap,participantCount:fmt,scheduledTime:d2.toISOString().split('T')[0]+'T'+time+':00',status:'upcoming',date:d2.toLocaleDateString('ru-RU')});

function resolveCapture(id,side){
 const c=captures.find(x=>x.id===id);if(!c)return;
 const winnerId=side==='att'?c.attackerId:c.defenderId;
 const loserId=side==='att'?c.defenderId:c.attackerId;
 const pts=100+(c.participantCount>=15?50:c.participantCount>=10?20:0);
 c.status='completed';c.winnerId=winnerId;c.pointsExchanged=pts;
 const terr=territories.find(t=>t.id===c.territoryId);
 if(terr){c.prevController=terr.controller;terr.controller=winnerId;}
 const wf=famById(winnerId),lf=famById(loserId);
 if(wf)wf.rating+=pts;if(lf)lf.rating=Math.max(0,lf.rating-Math.floor(pts/2));
 logAction('Капт #'+c.id+' завершён. Победитель: '+famName(winnerId)+' (+'+pts+' PTS). Зона #'+c.territoryId+' захвачена.','capture');
 persistAll();renderCaptures(document.getElementById('views'));
}

}
function submitAnnul(e,id){
 e.preventDefault();
 const c=captures.find(x=>x.id===id);if(!c)return;
 c.status='annulled';c.annulReason=document.getElementById('an-reason').value;
 const pts=c.pointsExchanged||100;
 const w=famById(c.winnerId);if(w)w.rating=Math.max(0,w.rating-pts);

 logAction('АННУЛИРОВАЛ капт #'+c.id+'. Очки и территория возвращены. Причина: '+c.annulReason,'capture');

}

function renderCommands(v){
 const max=maxCmd();
 const catName=id=>{const c=COMMAND_CATEGORIES.find(x=>x.id===id);return c?c.name:id;};
 const s=cmdSearch.toLowerCase();
 let base=ALL_COMMANDS.filter(c=>c.lvl<=max).filter(c=>{
   const ms=!s||c.command.toLowerCase().includes(s)||c.description.toLowerCase().includes(s)||c.syntax.toLowerCase().includes(s);
   const mc=cmdGroupBy==='level'||cmdCat==='all'||c.category===cmdCat;
   return ms&&mc;
 });
 const hidden=ALL_COMMANDS.filter(c=>c.lvl>max).length;
 let body='';
 const card=c=>'<div class="cmd-card"><div class="top"><span class="name">'+esc(c.command)+'</span>'+(c.lvl>0?'<span class="badge-lvl">'+c.lvl+'+ LVL</span>':'')+'</div><div class="desc">'+esc(c.description)+'</div><div class="foot"><span class="syn">'+esc(c.syntax)+'</span><button class="copy" onclick="copyText(\''+esc(c.syntax).replace(/'/g,"\\'")+'\')">'+ic('copy').replace('<svg','<svg style="width:13px;height:13px;vertical-align:-2px"')+' копировать</button></div></div>';
 if(cmdGroupBy==='level'){
   const tiers=[{lvl:0,name:'Без ограничения по уровню'},{lvl:7,name:'Senior · 7+ уровень'},{lvl:8,name:'8+ уровень'},{lvl:9,name:'9+ уровень'},{lvl:10,name:'10+ уровень'},{lvl:6,name:'FAMQ-кураторы · 6+ уровень'}];
   // группируем по фактическому lvl
   const groups={};base.forEach(c=>{(groups[c.lvl]=groups[c.lvl]||[]).push(c);});

  else act='<span class="chip">'+ic('trophy').replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px"')+' '+esc(e.winner||'—')+'</span>';
  return '<div class="cap-card"><div class="side" style="background:'+stcol+'"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="chip mono">'+e.id+'</span><span class="status-badge" style="color:'+stcol+';background:'+hexA(stcol,.14)+'">'+stt+'</span></div><h4 style="font-size:15px;font-weight:800">'+esc(e.name)+'</h4><div class="cap-meta" style="margin-top:10px"><div class="m"><div class="k">Тип</div><div class="v">'+esc(e.type)+'</div></div><div class="m"><div class="k">Время</div><div class="v">'+esc(String(e.when).replace('T',' '))+'</div></div><div class="m" style="grid-column:1/-1"><div class="k">Награда</div><div class="v">'+esc(e.reward||'—')+'</div></div></div><div style="border-top:1px solid var(--border);padding-top:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">'+act+'</div></div>';
 }).join('');
 v.innerHTML='<div class="grid-4">'+stat('sparkles','Всего ивентов',events.length,'a-accent')+stat('activity','Идут сейчас',events.filter(e=>e.status==='active').length,'a-success')+stat('calendar','Запланировано',events.filter(e=>e.status==='planned').length,'a-warn')+stat('trophy','Завершено',events.filter(e=>e.status==='done').length,'a-danger')+'</div><div class="spacer"></div>'
  +'<div class="toolbar" style="justify-content:flex-end"><button class="btn btn-primary btn-sm" onclick="openEvent()">'+ic('sparkles')+'Создать ивент</button></div>'
  +(cards?'<div class="cap-grid">'+cards+'</div>':emptyBox('Ивентов нет.'));
}
function eventStart(id){const e=events.find(x=>x.id===id);if(!e)return;e.status='active';logAction('Запущен ивент: '+e.name,'admin');persistAll();renderEvents(document.getElementById('views'));}
function eventFinish(id){const e=events.find(x=>x.id===id);if(!e)return;const w=prompt('Победитель ивента «'+e.name+'»:','');if(w===null)return;e.status='done';e.winner=w.trim()||'—';logAction('Завершён ивент '+e.name+'. Победитель: '+e.winner,'admin');persistAll();renderEvents(document.getElementById('views'));}
function eventDel(id){const e=events.find(x=>x.id===id);if(!e||!confirm('Удалить ивент «'+e.name+'»?'))return;events=events.filter(x=>x.id!==id);persistAll();renderEvents(document.getElementById('views'));}
function openEvent(){formModal('Создать ивент','sparkles',[{k:'name',label:'Название',val:''},{k:'type',label:'Тип',type:'select',val:'Царь Горы',options:['Царь Горы','ВЗХ','Судная ночь','Гонка','Кастомный'].map(t=>({v:t,t:t}))},{k:'when',label:'Дата и время',val:new Date().toISOString().slice(0,16)},{k:'reward',label:'Награда',val:''}],'Создать',vals=>{if(!vals.name.trim())return;events.push({id:'EV-'+Date.now(),name:vals.name.trim(),type:vals.type,status:'planned',when:vals.when,reward:vals.reward.trim()||'—',winner:''});logAction('Создан ивент: '+vals.name,'admin');persistAll();renderEvents(document.getElementById('views'));});}

/* ======================= ЛОГГЕРЫ ======================= */
function renderLoggers(v){
 let rows=logusers.map(u=>'<tr><td class="mono" style="font-weight:700">'+esc(u.login)+'</td><td><span class="badge-lvl">'+u.level+' LVL</span></td><td>'+esc(u.addedBy)+'</td><td class="mono">'+u.date+'</td><td style="text-align:right"><button class="btn btn-sm btn-danger" onclick="logDel(\''+esc(u.login)+'\')">'+ic('trash')+'Отозвать</button></td></tr>').join('');
 v.innerHTML='<div class="grid-2"><div class="panel"><div class="panel-title" style="justify-content:space-between"><span style="display:flex;align-items:center;gap:8px">'+ic('database')+'Доступ к сайту логов</span><button class="btn btn-sm btn-primary" onclick="openLogUser()">'+ic('plus')+'Выдать доступ</button></div>'+(rows?'<div class="tbl-wrap"><table><thead><tr><th>Логин</th><th>Уровень</th><th>Кем выдан</th><th>Дата</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':emptyBox('Нет выданных доступов.'))+'</div>'
  +'<div class="panel"><div class="panel-title">'+ic('search')+'Проверка на мультиаккаунт</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Введите CID для проверки связей аккаунта (симуляция /checkplmpacc).</div><div style="display:flex;gap:8px"><input id="mp-cid" placeholder="CID, напр. 7781"><button class="btn btn-primary" onclick="checkMulti()">Проверить</button></div><div id="mp-res" style="margin-top:12px"></div></div></div>';
}
function logDel(login){const u=logusers.find(x=>x.login===login);if(!u||!confirm('Отозвать доступ '+login+'?'))return;logusers=logusers.filter(x=>x.login!==login);logAction('Отозван доступ к логам: '+login,'admin');persistAll();renderLoggers(document.getElementById('views'));}
function openLogUser(){formModal('Выдать доступ к логам','database',[{k:'login',label:'Логин',val:''},{k:'level',label:'Уровень (1-10)',type:'number',val:8}],'Выдать',vals=>{if(!vals.login.trim())return;logusers.push({login:vals.login.trim(),level:Number(vals.level)||1,addedBy:roleName(curRole),date:new Date().toISOString().split('T')[0]});logAction('Выдан доступ к логам: '+vals.login,'admin');persistAll();renderLoggers(document.getElementById('views'));});}
function checkMulti(){const cid=document.getElementById('mp-cid').value.trim();const res=document.getElementById('mp-res');if(!cid){res.innerHTML='';return;}const n=parseInt(cid.replace(/\D/g,''),10)||0;const linked=n%3===0?2:n%2===0?1:0;res.innerHTML='<div class="box" style="font-size:12px">CID <b class="mono">'+esc(cid)+'</b>: '+(linked?'<span style="color:var(--danger);font-weight:700">найдено связей: '+linked+'</span> — рекомендуется ручная проверка.':'<span style="color:var(--success);font-weight:700">связей не обнаружено.</span>')+'</div>';}

/* ======================= CHEAT HUNTER ======================= */
function renderCheat(v){
 const list=chcases.filter(c=>chFilter==='all'||c.status===chFilter);
 let cards=list.map(c=>{const st={watch:['Наблюдение','var(--warn)'],confirmed:['Подтверждён','var(--danger)'],cleared:['Оправдан','var(--success)']}[c.status];let act='';
  if(c.status==='watch')act='<button class="btn btn-sm btn-danger" onclick="chSet(\''+c.id+'\',\'confirmed\')">Подтвердить</button> <button class="btn btn-sm" onclick="chSet(\''+c.id+'\',\'cleared\')">Оправдать</button>';
  else if(c.status==='confirmed')act='<button class="btn btn-sm btn-primary" onclick="chVerdict(\''+c.id+'\')">'+ic('gavel')+'Вердикт</button>';
  else act='<span class="chip">Дело закрыто</span>';
  return '<div class="cap-card"><div class="side" style="background:'+st[1]+'"></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span class="chip mono">'+c.id+' · '+c.date+'</span><span class="status-badge" style="color:'+st[1]+';background:'+hexA(st[1],.14)+'">'+st[0]+'</span></div><h4 style="font-size:15px;font-weight:800">'+esc(c.suspect)+' <span class="mono" style="font-size:11px;color:var(--text-dim)">'+esc(c.cid)+'</span></h4><div class="box" style="margin:10px 0;font-size:12px"><div style="font-size:9px;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:4px">Доказательства</div>'+esc(c.evidence)+'</div><div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">Агент: <b>'+esc(c.agent)+'</b>'+(c.verdict?' · Вердикт: <b style="color:var(--danger)">'+esc(c.verdict)+'</b>':'')+'</div><div style="border-top:1px solid var(--border);padding-top:10px;display:flex;gap:7px;flex-wrap:wrap;align-items:center">'+act+'</div></div>';
 }).join('');
 v.innerHTML='<div class="grid-4">'+stat('shield','Всего дел',chcases.length,'a-accent')+stat('eye','Наблюдение',chcases.filter(c=>c.status==='watch').length,'a-warn')+stat('ban','Подтверждено',chcases.filter(c=>c.status==='confirmed').length,'a-danger')+stat('check','Оправдано',chcases.filter(c=>c.status==='cleared').length,'a-success')+'</div><div class="spacer"></div>'
  +'<div class="toolbar" style="justify-content:space-between"><div class="seg"><button class="'+(chFilter==='all'?'active':'')+'" onclick="chFilter=\'all\';renderCheat(document.getElementById(\'views\'))">Все</button><button class="'+(chFilter==='watch'?'active':'')+'" onclick="chFilter=\'watch\';renderCheat(document.getElementById(\'views\'))">Наблюдение</button><button class="'+(chFilter==='confirmed'?'active':'')+'" onclick="chFilter=\'confirmed\';renderCheat(document.getElementById(\'views\'))">Подтв.</button><button class="'+(chFilter==='cleared'?'active':'')+'" onclick="chFilter=\'cleared\';renderCheat(document.getElementById(\'views\'))">Оправд.</button></div><button class="btn btn-primary btn-sm" onclick="openCase()">'+ic('plus')+'Новое дело</button></div>'
  +(cards?'<div class="cap-grid">'+cards+'</div>':emptyBox('Дел нет.'));
}
function chSet(id,st){const c=chcases.find(x=>x.id===id);if(!c)return;c.status=st;if(st==='cleared')c.verdict='Оправдан';logAction('Дело ЧХ '+c.id+' ('+c.suspect+') → '+st,'capture');persistAll();renderCheat(document.getElementById('views'));}
function chVerdict(id){const c=chcases.find(x=>x.id===id);if(!c)return;const vd=prompt('Вердикт по делу «'+c.suspect+'»:','Permanent Ban + shardban');if(vd===null)return;c.verdict=vd.trim();c.status='confirmed';logAction('Вынесен вердикт ЧХ по '+c.suspect+': '+c.verdict,'capture');persistAll();renderCheat(document.getElementById('views'));}
function openCase(){formModal('Новое дело Cheat Hunter','shield',[{k:'suspect',label:'Ник',val:''},{k:'cid',label:'CID',val:''},{k:'agent',label:'Агент',type:'select',val:'🕵️ Агент ЧХ',options:['🛡️ Руководитель ЧХ','🧭 Старший ЧХ','🕵️ Агент ЧХ','🐣 Стажёр ЧХ'].map(t=>({v:t,t:t}))},{k:'evidence',label:'Доказательства',type:'textarea',val:''}],'Открыть дело',vals=>{if(!vals.suspect.trim())return;chcases.push({id:'CH-'+Date.now(),suspect:vals.suspect.trim(),cid:vals.cid.trim()?'CID-'+vals.cid.replace('CID-','').trim():'—',status:'watch',evidence:vals.evidence.trim()||'—',agent:vals.agent,verdict:'',date:new Date().toLocaleDateString('ru-RU')});logAction('Открыто дело ЧХ: '+vals.suspect,'capture');persistAll();renderCheat(document.getElementById('views'));});}

/* ======================= ФОРУМ ======================= */
function renderForum(v){
 const list=forum.filter(f=>forumFilter==='all'||f.type===forumFilter||f.status===forumFilter);
 let rows=list.map(f=>{const st={open:['Открыто','var(--accent-2)'],review:['На рассмотрении','var(--warn)'],closed:['Закрыто','var(--text-dim)']}[f.status];let act='';
  if(f.status==='open')act='<button class="btn btn-sm" onclick="forumTake(\''+f.id+'\')">Взять в работу</button>';
  else if(f.status==='review')act='<button class="btn btn-sm btn-primary" onclick="forumClose(\''+f.id+'\',\'Удовлетворено\')">Принять</button> <button class="btn btn-sm btn-danger" onclick="forumClose(\''+f.id+'\',\'Отклонено\')">Отклонить</button>';
  else act='<span class="chip">'+esc(f.verdict||'—')+'</span>';
  return '<tr><td><span class="badge-grp" style="background:'+hexA(f.type==='appeal'?'#6c5ce7':'#0984e3',.16)+';color:'+(f.type==='appeal'?'#6c5ce7':'#0984e3')+'">'+(f.type==='appeal'?'АПЕЛ.':'ЖАЛОБА')+'</span></td><td style="font-weight:600">'+esc(f.subject)+'</td><td>'+esc(f.author)+'</td><td>'+esc(f.target||'—')+'</td><td><span class="status-badge" style="color:'+st[1]+';background:'+hexA(st[1],.14)+'">'+st[0]+'</span></td><td>'+esc(f.moderator||'—')+'</td><td style="text-align:right;white-space:nowrap">'+act+'</td></tr>';
 }).join('');
 v.innerHTML='<div class="grid-4">'+stat('message','Всего обращений',forum.length,'a-accent')+stat('inbox','Открыто',forum.filter(f=>f.status==='open').length,'a-danger')+stat('gauge','На рассмотрении',forum.filter(f=>f.status==='review').length,'a-warn')+stat('check','Закрыто',forum.filter(f=>f.status==='closed').length,'a-success')+'</div><div class="spacer"></div>'
  +'<div class="toolbar" style="justify-content:space-between"><div class="seg"><button class="'+(forumFilter==='all'?'active':'')+'" onclick="forumFilter=\'all\';renderForum(document.getElementById(\'views\'))">Все</button><button class="'+(forumFilter==='complaint'?'active':'')+'" onclick="forumFilter=\'complaint\';renderForum(document.getElementById(\'views\'))">Жалобы</button><button class="'+(forumFilter==='appeal'?'active':'')+'" onclick="forumFilter=\'appeal\';renderForum(document.getElementById(\'views\'))">Апелляции</button><button class="'+(forumFilter==='open'?'active':'')+'" onclick="forumFilter=\'open\';renderForum(document.getElementById(\'views\'))">Открытые</button></div><button class="btn btn-primary btn-sm" onclick="openForumItem()">'+ic('plus')+'Обращение</button></div>'
  +(rows?'<div class="tbl-wrap"><table><thead><tr><th>Тип</th><th>Тема</th><th>Автор</th><th>На кого</th><th>Статус</th><th>Модератор</th><th style="text-align:right">Действия</th></tr></thead><tbody>'+rows+'</tbody></table></div>':emptyBox('Обращений нет.'));
}
function forumTake(id){const f=forum.find(x=>x.id===id);if(!f)return;f.status='review';f.moderator=roleName(curRole);logAction('Взято в работу обращение: '+f.subject,'admin');persistAll();renderForum(document.getElementById('views'));}
function forumClose(id,verdict){const f=forum.find(x=>x.id===id);if(!f)return;f.status='closed';f.verdict=verdict;if(!f.moderator)f.moderator=roleName(curRole);logAction('Закрыто обращение «'+f.subject+'»: '+verdict,'admin');persistAll();renderForum(document.getElementById('views'));}
function openForumItem(){formModal('Новое обращение','message',[{k:'type',label:'Тип',type:'select',val:'complaint',options:[{v:'complaint',t:'Жалоба'},{v:'appeal',t:'Апелляция'}]},{k:'subject',label:'Тема',val:''},{k:'author',label:'Автор',val:''},{k:'target',label:'На кого (если есть)',val:''}],'Создать',vals=>{if(!vals.subject.trim())return;forum.push({id:'F-'+Date.now(),type:vals.type,subject:vals.subject.trim(),author:vals.author.trim()||'—',target:vals.target.trim(),status:'open',moderator:'',verdict:'',date:new Date().toLocaleDateString('ru-RU')});logAction('Создано обращение: '+vals.subject,'admin');persistAll();renderForum(document.getElementById('views'));});}

/* ======================= ТЕХ. АДМИНИСТРАЦИЯ ======================= */
function renderTech(v){
 const TG=[['marketplace','Маркетплейс'],['arena','PvP-Арена'],['greenzone','Зелёные зоны'],['hunting','Охота'],['blackday','Судная ночь'],['capturecd','КД на капты'],['whitelist','Белый список'],['trucking','Грузоперевозки']];
 let sw=TG.map(t=>'<div class="tog-row"><span>'+t[1]+'</span><button class="switch'+(toggles[t[0]]?' on':'')+'" onclick="toggleServer(\''+t[0]+'\')"><span class="knob"></span></button></div>').join('');
 const list=tech.filter(t=>techFilter==='all'||t.status===techFilter);
 let rows=list.map(t=>{const pc={high:['Высокий','var(--danger)'],med:['Средний','var(--warn)'],low:['Низкий','var(--text-dim)']}[t.priority];const st={open:'Открыт',progress:'В работе',done:'Готово'}[t.status];return '<tr><td style="font-weight:600">'+esc(t.title)+'</td><td>'+esc(t.area)+'</td><td><span class="status-badge" style="color:'+pc[1]+';background:'+hexA(pc[1],.14)+'">'+pc[0]+'</span></td><td>'+st+'</td><td>'+esc(t.assignee||'—')+'</td><td style="text-align:right;white-space:nowrap"><button class="btn btn-sm" title="Сменить статус" onclick="techCycle(\''+t.id+'\')">'+ic('rotate')+'</button> <button class="btn btn-sm btn-danger" onclick="techDel(\''+t.id+'\')">'+ic('trash')+'</button></td></tr>';}).join('');
 v.innerHTML='<div class="grid-2"><div class="panel"><div class="panel-title">'+ic('power')+'Состояние сервера</div><div class="tog-list">'+sw+'</div></div>'
  +'<div class="panel"><div class="panel-title" style="justify-content:space-between"><span style="display:flex;align-items:center;gap:8px">'+ic('wrench')+'Тех. тикеты</span><button class="btn btn-sm btn-primary" onclick="openTicket()">'+ic('plus')+'Тикет</button></div><div class="seg" style="margin-bottom:12px"><button class="'+(techFilter==='all'?'active':'')+'" onclick="techFilter=\'all\';renderTech(document.getElementById(\'views\'))">Все</button><button class="'+(techFilter==='open'?'active':'')+'" onclick="techFilter=\'open\';renderTech(document.getElementById(\'views\'))">Открытые</button><button class="'+(techFilter==='progress'?'active':'')+'" onclick="techFilter=\'progress\';renderTech(document.getElementById(\'views\'))">В работе</button><button class="'+(techFilter==='done'?'active':'')+'" onclick="techFilter=\'done\';renderTech(document.getElementById(\'views\'))">Готово</button></div>'+(rows?'<div class="tbl-wrap"><table><thead><tr><th>Задача</th><th>Область</th><th>Приоритет</th><th>Статус</th><th>Исполнитель</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>':emptyBox('Тикетов нет.'))+'</div></div>';
}
function toggleServer(k){toggles[k]=!toggles[k];logAction('Состояние сервера: '+k+' → '+(toggles[k]?'ВКЛ':'ВЫКЛ'),'admin');persistAll();renderTech(document.getElementById('views'));}
function techCycle(id){const t=tech.find(x=>x.id===id);if(!t)return;t.status=t.status==='open'?'progress':t.status==='progress'?'done':'open';if(t.status==='progress'&&!t.assignee)t.assignee=roleName(curRole);persistAll();renderTech(document.getElementById('views'));}
function techDel(id){const t=tech.find(x=>x.id===id);if(!t||!confirm('Удалить тикет?'))return;tech=tech.filter(x=>x.id!==id);persistAll();renderTech(document.getElementById('views'));}
function openTicket(){formModal('Новый тех. тикет','wrench',[{k:'title',label:'Задача',val:''},{k:'area',label:'Область',val:''},{k:'priority',label:'Приоритет',type:'select',val:'med',options:[{v:'high',t:'Высокий'},{v:'med',t:'Средний'},{v:'low',t:'Низкий'}]}],'Создать',vals=>{if(!vals.title.trim())return;tech.push({id:'T-'+Date.now(),title:vals.title.trim(),area:vals.area.trim()||'—',priority:vals.priority,status:'open',assignee:''});logAction('Создан тех. тикет: '+vals.title,'admin');persistAll();renderTech(document.getElementById('views'));});}

/* ======================= ЧАСЫ ======================= */
function tick(){const el=document.getElementById('clock-t');if(!el)return;const d=new Date();el.textContent=d.toLocaleTimeString('ru-RU');}

/* ======================= МОБИЛЬНОЕ МЕНЮ ======================= */
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('sb-backdrop').classList.add('open');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-backdrop').classList.remove('open');}

/* ======================= ИНИЦИАЛИЗАЦИЯ ======================= */
function boot(){
 applyTheme(load('theme')||'light');
 loadState();
 applyBrand();
 buildRolePicker();
 renderNav();
 switchTab('dashboard');
 tick();setInterval(tick,1000);
 const hb=document.getElementById('hamburger');if(hb)hb.addEventListener('click',openSidebar);
 const bd=document.getElementById('sb-backdrop');if(bd)bd.addEventListener('click',closeSidebar);
 const ov=document.getElementById('overlay');if(ov)ov.addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeSidebar();}});
}
window.addEventListener('DOMContentLoaded',()=>{
 try{boot();}
 catch(err){
   // Повреждённые сохранённые данные — очищаем и пробуем заново с исходными
   try{Object.keys(localStorage).filter(k=>k.indexOf(LS)===0).forEach(k=>localStorage.removeItem(k));}catch(_){}
   try{boot();}
   catch(e2){
     const v=document.getElementById('views');
     if(v)v.innerHTML='<div style="padding:24px"><h3>Не удалось запустить панель</h3><p style="color:#586274;margin:8px 0">'+(e2&&e2.message||e2)+'</p><button onclick="try{localStorage.clear()}catch(_){}; location.reload()" style="padding:9px 14px;border-radius:9px;border:1px solid #cbd2dd;background:#284b8c;color:#fff;font-weight:700;cursor:pointer">Сбросить и перезагрузить</button></div>';
   }
 }
});
</script>
</body>
